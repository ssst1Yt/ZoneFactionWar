
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect files
        run: |
          pwd
          ls -la
          find . -maxdepth 4 \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \)

      - name: Build APK
        run: |
          if [ -f stalker_android_project/gradlew ]; then
            cd stalker_android_project
          elif [ -f gradlew ]; then
            :
          else
            echo "Gradle project not found"
            exit 1
          fi
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ZoneFactionWar-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
