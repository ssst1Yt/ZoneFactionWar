
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: stalker_android_project
        run: |
          gradle --version
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ZoneFactionWar-APK
          path: stalker_android_project/app/build/outputs/apk/debug/app-debug.apk
